<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>냠냠 지구 지킴이 · 교사용</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8ef;--card:#fff;--ink:#24321f;--muted:#6b7a64;--green:#3d9a4f;--green-d:#2b7a3b;--green-l:#e3f3df;--sun:#ffc93c;--sun-l:#fff4cf;--sky:#5aa9e6;--sky-l:#e3f1fc;--red:#e8684a;--red-l:#fde7e1;--line:#e3e8da}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3,button,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h1{font-size:26px;margin:0}h2{font-size:20px;margin:0 0 10px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 0 var(--line)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
.kpi .lab{color:var(--muted);font-size:14px}.kpi .v{font-family:'Jua';font-size:32px;line-height:1.15}.kpi .s{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:9px 14px;font-size:16px;cursor:pointer;background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d)}
.btn.sec{background:#fff;color:var(--green-d);border:2px solid var(--line);box-shadow:none}
.btn.small{font-size:14px;padding:5px 10px;border-radius:10px}
input{font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:12px;width:100%}
.muted{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:'Jua';font-weight:400;color:var(--muted);cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px}
.tag.ok{background:var(--green-l);color:var(--green-d)}.tag.no{background:var(--sun-l);color:#7a5a00}.tag.bad{background:var(--red-l);color:#8a2e17}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:10px;border-bottom:2px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:8px;position:relative}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#7cc96b,var(--green));border-radius:6px 6px 0 0}
.bar i.w{background:linear-gradient(180deg,#f3a48f,var(--red))}
.bar b{font-weight:400;font-size:11px;color:var(--muted)}
.xl{display:flex;gap:4px}.xl span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:8px}
.hbar{height:12px;background:#eef2e8;border-radius:99px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--red);border-radius:99px}
.hbar.g i{background:var(--green)}
.alert{border:3px solid var(--red)}
.item{border-bottom:1px dashed var(--line);padding:8px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.legend{font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:15px}
.login{max-width:420px;margin:60px auto}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card login"><h2>교사용 대시보드를 여는 중…</h2><p class="muted">이 문장이 계속 보이면 화면 맨 위의 빨간 오류 문장을 캡처해 주세요.</p></div>
</div>
<script>
window.__showErr=function(m){
  var d=document.getElementById('errbar');
  if(!d){d=document.createElement('div');d.id='errbar';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#fde7e1;color:#8a2e17;padding:10px 14px;font-size:14px;border-bottom:2px solid #e8684a;word-break:break-all';
    document.body.appendChild(d);}
  d.textContent='⚠️ 오류: '+m+' (이 문장을 캡처해 주세요)';
};
window.addEventListener('error',function(e){window.__showErr((e.message||'알 수 없는 오류')+(e.lineno?' [줄 '+e.lineno+']':''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.__showErr(r&&r.message?r.message:String(r));});
</script>
