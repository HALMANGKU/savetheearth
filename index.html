<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냠냠 지구 지킴이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8ef; --card:#ffffff; --ink:#24321f; --muted:#6b7a64;
  --green:#3d9a4f; --green-d:#2b7a3b; --green-l:#e3f3df;
  --sun:#ffc93c; --sun-l:#fff4cf; --sky:#5aa9e6; --sky-l:#e3f1fc;
  --red:#e8684a; --red-l:#fde7e1; --line:#e3e8da; --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,.jua,button,.tab{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
h1{font-size:28px;margin:0}
h2{font-size:23px;margin:0 0 10px}
h3{font-size:19px;margin:0 0 6px}
p{margin:6px 0}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top .nick{background:var(--green-l);color:var(--green-d);padding:6px 12px;border-radius:999px;font-family:'Jua';font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:16px;padding:14px 20px;font-size:19px;cursor:pointer;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.sec{background:#fff;color:var(--green-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#5a4300;box-shadow:0 4px 0 #d9a514}
.btn.small{font-size:16px;padding:9px 14px;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.muted{color:var(--muted);font-size:15px}
.tiny{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--sun);border-color:var(--sun)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:720px;width:100%}
.tab{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:15px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:26px;line-height:1}
.tab.on{color:var(--green-d)}
.tab.on .ic{transform:scale(1.15)}
.hide{display:none!important}
.hero{display:flex;gap:16px;align-items:center}
.tree{font-size:72px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.06))}
.bar{height:18px;background:#eef2e8;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7cc96b);border-radius:999px;transition:width .6s}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-size:14px;margin:2px 4px 2px 0}
.chip.sky{background:var(--sky-l);color:#1f6aa5}
.chip.sun{background:var(--sun-l);color:#7a5a00}
.menuBtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin:6px 0;font-size:18px;cursor:pointer;color:var(--ink)}
.menuBtn .em{font-size:28px}
.menuBtn:hover{border-color:var(--sun)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--green)}
.photo{aspect-ratio:4/3;border:3px dashed #c9d4bd;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafcf6;overflow:hidden;cursor:pointer;position:relative;text-align:center;padding:8px}
.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo .big{font-size:48px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#eee}
.cmp .lab{font-family:'Jua';text-align:center;font-size:15px;color:var(--muted)}
.leftRow{border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0}
.leftRow .nm{font-family:'Jua';font-size:18px;margin-bottom:6px}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 2px;cursor:pointer;font-size:13px;color:var(--ink);font-family:'Gowun Dodum'}
.lv button b{display:block;font-size:22px;font-family:'Jua';font-weight:400}
.lv button.on{border-color:var(--green);background:var(--green-l)}
.big-num{font-family:'Jua';font-size:34px;line-height:1.1}
.stat{background:#fafcf6;border-radius:16px;padding:12px;text-align:center}
.stat .lab{font-size:14px;color:var(--muted)}
.celebrate{text-align:center;background:linear-gradient(160deg,var(--sun-l),#fff);border:3px solid var(--sun)}
.celebrate .em{font-size:64px}
.stk{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stk div{aspect-ratio:1;border-radius:14px;background:#fafcf6;display:flex;align-items:center;justify-content:center;font-size:30px;border:2px solid var(--line)}
.stk div.lock{filter:grayscale(1);opacity:.35;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .d{border:2px solid var(--line);border-radius:12px;padding:6px;font-size:13px;min-height:62px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font-family:'Gowun Dodum'}
.cal .d.today{border-color:var(--sun);background:var(--sun-l)}
.cal .d .n{font-family:'Jua';font-size:15px}
.cal .d.empty{background:transparent;border-style:dashed;cursor:default;opacity:.5}
.cal .h{text-align:center;font-family:'Jua';color:var(--muted);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(30,40,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal .box{background:#fff;border-radius:24px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:20px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{float:right;border:0;background:#eef2e8;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.src{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.src a{color:#1f6aa5}
.warn{background:var(--red-l);border-radius:14px;padding:10px 12px;color:#8a2e17;font-size:15px;margin-top:8px}
.ok{background:var(--green-l);border-radius:14px;padding:10px 12px;color:var(--green-d);font-size:15px;margin-top:8px}
.help{background:var(--sky-l);border-radius:16px;padding:14px;color:#174d78}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:26px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.list li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:70;font-size:15px}
@media(max-width:420px){.stk{grid-template-columns:repeat(4,1fr)}.cal .d{min-height:54px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card" style="text-align:center;margin-top:30px">
    <div style="font-size:56px">🌍</div>
    <h2>냠냠 지구 지킴이를 여는 중…</h2>
    <p class="muted">이 문장이 5초 넘게 그대로 보이면 앱 코드가 실행되지 못한 거예요.<br>화면 맨 위의 빨간 오류 문장을 캡처해 주세요.</p>
  </div>
</div>
<nav class="nav hide" id="nav"><div class="in">
  <button class="tab" data-v="home"><span class="ic">🏡</span>홈</button>
  <button class="tab" data-v="record"><span class="ic">📸</span>기록하기</button>
  <button class="tab" data-v="menu"><span class="ic">🍱</span>식단표</button>
  <button class="tab" data-v="reward"><span class="ic">🏅</span>보상함</button>
  <button class="tab" data-v="info"><span class="ic">📚</span>알아보기</button>
</div></nav>

window.__showErr=function(m){
  var d=document.getElementById('errbar');
  if(!d){d=document.createElement('div');d.id='errbar';
    d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#fde7e1;color:#8a2e17;padding:10px 14px;font-size:14px;border-bottom:2px solid #e8684a;word-break:break-all';
    document.body.appendChild(d);}
  d.textContent='⚠️ 오류: '+m+' (이 문장을 캡처해 주세요)';
};
window.addEventListener('error',function(e){window.__showErr((e.message||'알 수 없는 오류')+(e.lineno?' [줄 '+e.lineno+']':''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.__showErr(r&&r.message?r.message:String(r));});
</script>
